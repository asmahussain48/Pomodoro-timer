<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A beautiful, distraction-free Pomodoro timer with focus/break modes, ambient sounds, and fullscreen mode." />
  <meta name="theme-color" content="#0f0c29" />
  <link rel="icon" type="image/jpeg" href="images/iconImage.jpg">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="main-layout" id="fullscreen-wrapper">
    <aside class="sound-panel">
      <h3><span class="icon-badge">🎵</span> Ambient Sound</h3>
      <div class="sound-option">
        <span>🎬 Original video sound</span>
        <input type="range" data-sound="original" aria-label="Original video sound volume" />
      </div>
      <div class="sound-option">
        <span>🎧 LoFi beats</span>
        <input type="range" data-sound="lofi" aria-label="LoFi beats volume" />
      </div>
      <div class="sound-option">
        <span>🌿 Nature sounds</span>
        <input type="range" data-sound="nature" aria-label="Nature sounds volume" />
      </div>
      <div class="sound-option">
        <span>💧 Rain sounds</span>
        <input type="range" data-sound="rain" aria-label="Rain sounds volume" />
      </div>
      <div class="sound-option">
        <span>🔥 Fireplace sounds</span>
        <input type="range" data-sound="fireplace" aria-label="Fireplace sounds volume" />
      </div>
      <div class="sound-option">
        <span>📚 Library ambience</span>
        <input type="range" data-sound="library" aria-label="Library ambience volume" />
      </div>
    </aside>

    <main class="container">
      <p class="eyebrow">Stay focused, one session at a time</p>
      <h1 class="title">Pomodoro Timer</h1>

      <div class="mode-tabs" role="tablist" aria-label="Timer mode">
        <button class="mode-tab active" data-mode="focus" role="tab" aria-selected="true">Focus</button>
        <button class="mode-tab" data-mode="short" role="tab" aria-selected="false">Short Break</button>
        <button class="mode-tab" data-mode="long" role="tab" aria-selected="false">Long Break</button>
      </div>

      <div class="ring-wrapper">
        <svg class="progress-ring" width="280" height="280" viewBox="0 0 280 280">
          <circle class="ring-track" cx="140" cy="140" r="126"></circle>
          <circle class="ring-progress" id="ring-progress" cx="140" cy="140" r="126"></circle>
        </svg>
        <div class="ring-center">
          <p class="timer" id="timer">25:00</p>
          <p class="timer-state" id="timer-state">Ready when you are</p>
        </div>
      </div>

      <div class="session-dots" id="session-dots" aria-label="Completed focus sessions"></div>

      <div class="button-wrapper">
        <button id="start" class="btn btn-start"><span>▶</span> Start</button>
        <button id="stop" class="btn btn-stop"><span>⏸</span> Pause</button>
        <button id="reset" class="btn btn-reset"><span>↺</span> Reset</button>
      </div>

      <button id="fullscreen" class="icon-btn fullscreen-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H7v5zm10 0h-2V7h-3V5h5v5zm-2 6h3v-3h2v5h-5v-2z"/>
        </svg>
      </button>

      <button id="settings-btn" class="icon-btn settings-btn" title="Customize timer durations" aria-label="Customize timer durations" aria-haspopup="dialog">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M19.14,12.94a7.14,7.14,0,0,0,.05-1,7.14,7.14,0,0,0-.05-1l2.11-1.65a.5.5,0,0,0,.12-.64l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.3,7.3,0,0,0-1.71-1l-.38-2.65A.49.49,0,0,0,14,2H10a.49.49,0,0,0-.49.42L9.13,5.07a7.3,7.3,0,0,0-1.71,1l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.64L4.56,11a7.14,7.14,0,0,0,0,2L2.45,14.65a.5.5,0,0,0-.12.64l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.3,7.3,0,0,0,1.71,1l.38,2.65A.49.49,0,0,0,10,22h4a.49.49,0,0,0,.49-.42l.38-2.65a7.3,7.3,0,0,0,1.71-1l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.64ZM12,15.5A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
        </svg>
      </button>
    </main>
  </div>

  <div class="modal-overlay" id="settings-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">Customize Timer</h2>
        <button class="modal-close" id="settings-close" aria-label="Close settings">✕</button>
      </div>
      <p class="modal-subtitle">Set your own session lengths, in minutes.</p>

      <div class="duration-field">
        <label for="focus-duration">🎯 Focus</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="focus-duration" data-step="-1" aria-label="Decrease focus minutes">−</button>
          <input type="number" id="focus-duration" min="1" max="180" inputmode="numeric" value="25" />
          <button type="button" class="step-btn" data-target="focus-duration" data-step="1" aria-label="Increase focus minutes">+</button>
        </div>
      </div>

      <div class="duration-field">
        <label for="short-duration">☕ Short Break</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="short-duration" data-step="-1" aria-label="Decrease short break minutes">−</button>
          <input type="number" id="short-duration" min="1" max="180" inputmode="numeric" value="5" />
          <button type="button" class="step-btn" data-target="short-duration" data-step="1" aria-label="Increase short break minutes">+</button>
        </div>
      </div>

      <div class="duration-field">
        <label for="long-duration">🛋️ Long Break</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="long-duration" data-step="-1" aria-label="Decrease long break minutes">−</button>
          <input type="number" id="long-duration" min="1" max="180" inputmode="numeric" value="15" />
          <button type="button" class="step-btn" data-target="long-duration" data-step="1" aria-label="Increase long break minutes">+</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="settings-reset">Reset Defaults</button>
        <button class="btn btn-save" id="settings-save">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="index.js"></script>
</body>
</html>
